# Overlay the locked OpenRAG source compose.
services:
  opensearch:
    build:
      context: ${OPENRAG_SOURCE_DIR:?Prepare the locked OpenRAG source}
    environment:
      path.repo: /usr/share/opensearch/snapshots
    volumes:
      - customer-search-snapshots:/usr/share/opensearch/snapshots
  openrag-backend:
    image: rakazo-openrag-backend:${OPENRAG_SOURCE_ID:?Prepare the locked OpenRAG source}
    pull_policy: never
    build:
      context: ${OPENRAG_SOURCE_DIR:?Prepare the locked OpenRAG source}
    environment:
      OPENRAG_RBAC_ENFORCE: "true"
      OPENRAG_BACKEND_ROUTER_ENABLE: "true"
      UVICORN_WORKERS: "1"
      CACHE_BACKEND: memory
    networks:
      default: {}
      support:
        aliases: [rakazo-support-rag, rakazo-support-rag.localhost]
  openrag-frontend:
    build:
      context: ${OPENRAG_SOURCE_DIR:?Prepare the locked OpenRAG source}
  langflow:
    build:
      context: ${OPENRAG_SOURCE_DIR:?Prepare the locked OpenRAG source}
    environment:
      LANGFLOW_ALLOW_CUSTOM_COMPONENTS: "false"
      LANGFLOW_DEACTIVATE_TRACING: "true"
      LANGFLOW_LOG_TRACE_LOCALS: "false"
    volumes:
      # Operator-installed extension; preserve the image's existing OpenRAG components.
      - ../../infra/langflow/components/rakazo:/app/custom_components/rakazo:ro
    networks:
      default: {}
      support:
        aliases: [rakazo-support-langflow.localhost]
networks:
  support:
    external: true
    name: rakazo-support
volumes:
  customer-search-snapshots:
