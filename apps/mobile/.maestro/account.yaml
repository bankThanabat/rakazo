appId: com.rakazo.app
name: Native account and session recovery
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- runFlow: sign-in.yaml
- extendedWaitUntil:
    visible: "Document reviewer.*"
    timeout: 30000
- takeScreenshot: "signed-in"
- tapOn: "Account"
- extendedWaitUntil:
    visible: "Change password, ›"
    timeout: 10000
- assertVisible: ${RAKAZO_E2E_EMAIL}
- tapOn: "Change password, ›"
- tapOn: "Current password"
- inputText: ${RAKAZO_E2E_PASSWORD}
- tapOn: "New password"
- inputText: ${RAKAZO_E2E_NEW_PASSWORD}
- tapOn: "Confirm password"
- inputText: "mismatched-synthetic-password"
- hideKeyboard
- tapOn:
    text: "Change password"
    below: "Confirm password"
- assertVisible: "Passwords do not match"
- takeScreenshot: "password-mismatch"
- tapOn: "Confirm password"
- eraseText
- inputText: ${RAKAZO_E2E_NEW_PASSWORD}
- hideKeyboard
- tapOn:
    text: "Change password"
    below: "Confirm password"
- extendedWaitUntil:
    visible: "Password updated"
    timeout: 10000
- tapOn: "OK"
- scrollUntilVisible:
    element: "Sign out"
    direction: DOWN
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Sign in to Deskazo"
    timeout: 10000
- tapOn: "Email"
- inputText: ${RAKAZO_E2E_EMAIL}
- tapOn: "Password"
- inputText: ${RAKAZO_E2E_NEW_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- tapOn:
    text: "Not Now"
    optional: true
- tapOn:
    text: "Don.t allow"
    optional: true
- extendedWaitUntil:
    visible: "Document reviewer.*"
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Document reviewer.*"
    timeout: 30000
- takeScreenshot: "restored-session"
