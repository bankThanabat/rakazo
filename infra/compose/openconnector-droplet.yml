name: openconnector

services:
  connector:
    image: rakazo-openconnector:${OPENCONNECTOR_REVISION:?Set the deployed source commit}
    build:
      context: ./source
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - connector-data:/app/data
    environment:
      OOMOL_CONNECT_DATA_DIR: /app/data
      OOMOL_CONNECT_ORIGIN: ${OPENCONNECTOR_ORIGIN:?Set the browser-facing origin}
      OOMOL_CONNECT_ENCRYPTION_KEY: ${OOMOL_CONNECT_ENCRYPTION_KEY:?Set the encryption key}
      OOMOL_CONNECT_ADMIN_TOKEN: ${OOMOL_CONNECT_ADMIN_TOKEN:?Set the admin token}
      OOMOL_CONNECT_RUNTIME_TOKEN: ${OOMOL_CONNECT_RUNTIME_TOKEN:?Set the server-only runtime token}
      OOMOL_CONNECT_CATALOG_LAZY_SCHEMAS: "true"
      OOMOL_CONNECT_ALLOW_PRIVATE_NETWORK: "false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  connector-data:
